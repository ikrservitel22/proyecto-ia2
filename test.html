<!DOCTYPE html>
<html>
<head>
    <title>Realtime Speech</title>

    <style>
        body{
            font-family: Arial;
            padding:20px;
        }

        button{
            padding:10px;
            margin:5px;
        }

        #output{
            border:1px solid #ccc;
            padding:10px;
            height:300px;
            overflow:auto;
            white-space:pre-wrap;
        }

        #live{
            border:1px dashed #aaa;
            padding:10px;
            height:40px;
            margin-bottom:10px;
            color: gray;
            font-style: italic;
        }
    </style>
</head>

<body>

<h1>Realtime Speech</h1>

<button id="start">INICIAR</button>
<button id="stop">DETENER</button>

<hr>

<div id="status"></div>

<!-- 🟢 texto en vivo -->
<div id="live">...</div>

<!-- ⚡ texto final -->
<pre id="output"></pre>

<script>

let ws = null
let stream = null
let audioContext = null
let processor = null
let source = null

let running = false

const output = document.getElementById("output")
const status = document.getElementById("status")
const live = document.getElementById("live")

function stopEverything(){

    running = false

    if(processor){
        processor.disconnect()
        processor = null
    }

    if(source){
        source.disconnect()
        source = null
    }

    if(audioContext){
        audioContext.close()
        audioContext = null
    }

    if(stream){
        stream.getTracks().forEach(t => t.stop())
        stream = null
    }

    if(ws){
        ws.close()
        ws = null
    }

    status.innerText = "Detenido"
}

function resampleBuffer(buffer, inputSampleRate, outputSampleRate){

    if(inputSampleRate === outputSampleRate){
        return buffer
    }

    const ratio = inputSampleRate / outputSampleRate
    const newLength = Math.round(buffer.length / ratio)
    const result = new Float32Array(newLength)

    for(let i = 0; i < newLength; i++){
        const index = i * ratio
        const before = Math.floor(index)
        const after = Math.min(before + 1, buffer.length - 1)
        const atPoint = index - before
        result[i] = buffer[before] + (buffer[after] - buffer[before]) * atPoint
    }

    return result
}

document.getElementById("stop").onclick = stopEverything

document.getElementById("start").onclick = async () => {

    stopEverything()

    output.innerText = ""
    live.innerText = ""
    running = true

    // =========================
    // WS
    // =========================
    ws = new WebSocket("ws://localhost:8004/ws/realtime")
    ws.binaryType = "arraybuffer"

    ws.onopen = () => {
        status.innerText = "Conectado"
    }

    ws.onmessage = (event) => {

        const data = JSON.parse(event.data)

        // 🟢 LIVE (parcial)
        if(data.type === "partial"){
            live.innerText = "🎤 " + data.texto
        }

        // ⚡ FINAL (confirmado)
        if(data.type === "final"){
            output.innerText += data.texto + " "
            output.scrollTop = output.scrollHeight
        }

        if(data.error){
            output.innerText += "\nERROR: " + data.error
        }
    }

    ws.onclose = () => {
        status.innerText = "Desconectado"
    }

    await new Promise(res => ws.addEventListener("open", res))

    // =========================
    // MIC
    // =========================
    stream = await navigator.mediaDevices.getUserMedia({
        audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
        }
    })

    audioContext = new AudioContext({ sampleRate: 16000 })
    await audioContext.resume()

    const inputSampleRate = audioContext.sampleRate

    source = audioContext.createMediaStreamSource(stream)

    processor = audioContext.createScriptProcessor(1024, 1, 1)

    processor.onaudioprocess = (e) => {

        if(!running || !ws || ws.readyState !== 1) return

        const input = e.inputBuffer.getChannelData(0)

        const resampled = resampleBuffer(
            input,
            inputSampleRate,
            16000
        )

        const pcm = new Int16Array(resampled.length)

        let sum = 0

        for(let i = 0; i < resampled.length; i++){

            let s = Math.max(-1, Math.min(1, resampled[i]))

            pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF

            sum += Math.abs(pcm[i])
        }

        const volume = sum / pcm.length

        if(volume < 30) return

        ws.send(pcm.buffer)
    }

    source.connect(processor)
    processor.connect(audioContext.destination)

    status.innerText = "Escuchando..."
}

</script>

</body>
</html>
